<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>
<body>

<h2>Student Registration Form</h2>

<form method="post" action="submit.html">

Name:<br>
<input type="text" name="name" placeholder="Enter student name" required><br><br>

Parent Name:<br>
<input type="text" name="parentname" placeholder="Enter parent name" required><br><br>

Address:<br>
<textarea name="address" placeholder="Enter address" required></textarea><br><br>

Age:<br>
<input type="number" name="age" placeholder="Enter age" required><br><br>

Email:<br>
<input type="email" name="email" placeholder="Enter email address" required><br><br>

<input type="submit" value="Register">

</form>

</body>
</html>
